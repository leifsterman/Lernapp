# Veröffentlicht die Seite bei jedem Push auf main über GitHub Pages.
# Einmalig nötig: Repo -> Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      # Einmalige Recovery: Der alte Pages-Lauf 8687f8b blieb laut API
      # als Deployment aktiv, obwohl sein Action-Job fehlgeschlagen ist.
      - name: Blockiertes altes Pages-Deployment freigeben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/8687f8bee12fd467c0a25d33d5de8e1def928549/cancel" --silent || echo "Altes Deployment bereits beendet oder nicht erreichbar."
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
