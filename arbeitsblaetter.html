<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbeitsblätter · Physik Q1</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0b111b;color:#e8edf6}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:20px 16px 70px}a{color:#9bcaff}h1{font-size:clamp(1.6rem,5vw,2.4rem)}h2{font-size:1.25rem}p{line-height:1.65}.muted{color:#a9b9cb}.panel{background:#151f2e;border:1px solid #344256;border-radius:16px;padding:18px;margin:14px 0}.nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #43566c;border-radius:10px;background:#22344a;color:white;padding:11px 14px;cursor:pointer;font:inherit}button.active,.primary{background:#2473bc;border-color:#61a6e9}button:focus-visible{outline:3px solid #ffce69}input{background:#101927;color:white;border:1px solid #63758b;border-radius:8px;padding:10px;font:inherit;max-width:100%}.card{min-height:185px}.formula{font-size:1.18rem;color:#bce3ff;background:#0c1826;border-radius:10px;padding:12px;margin:10px 0;overflow:auto}details{border-top:1px solid #3b4d61;padding:12px 0}summary{cursor:pointer;font-weight:600}.tag{color:#9bd4ae;font-size:.85rem}svg{width:100%;max-width:560px;height:auto;display:block;margin:10px auto}.quizOption{display:block;width:100%;margin:8px 0;text-align:left}.correct{border-color:#4ec38b}.wrong{border-color:#ef8585}#feedback{min-height:32px}small{color:#b6c4d5}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #394a5f;text-align:left}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}.math{font-family:Cambria,"STIX Two Math","Times New Roman",serif;font-size:1.3rem;line-height:1.45;white-space:normal}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.2;margin:0 .14em;font-size:.92em}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em .13em}.frac>span:last-child{padding:.13em .2em 0}.formula td{vertical-align:middle}@media(max-width:520px){.math{font-size:1.08rem}td,th{padding:7px 5px}}</style></head><body><main><a href="index.html">← Zur Lernapp</a><h1>Arbeitsblätter: Elektrische Felder & Kondensatoren</h1><p class="muted">Eigener Lernbereich zu den sechs Arbeitsblattseiten: Erklärungen, Lösungswege, Formeln, Karteikarten, Quiz und Schaubilder. Der bestehende Lernstoff bleibt erhalten.</p><div class="nav" id="tabs"><button class="active" data-view="tasks">Aufgaben</button><button data-view="cards">Karteikarten</button><button data-view="formulas">Formelsammlung</button><button data-view="quiz">Wissen testen</button><button data-view="visuals">Schaubilder</button></div><section id="content" aria-live="polite"></section></main><script>
const topics=[
["Feldlinien","Feldlinien zeigen die Kraftrichtung auf positive Probeladungen. Sie schneiden sich nicht; ihre Dichte steht für die Feldstärke.","Positive zu negative Ladung; zwei negative Ladungen werden nicht durch Feldlinien verbunden. Zwischen idealen parallelen Platten verlaufen Feldlinien parallel.","E = F / |q|","Bei gleichen negativen Ladungen ist E im Mittelpunkt null."],
["Kraft & Coulomb","Die elektrische Kraft auf eine Probeladung hängt von ihrer Ladung und dem örtlichen Feld ab.","Bei Q₁=+1 µC, Q₂=−1 µC und r=2 m ergibt sich F=2,25·10⁻³ N; bei 4 m nur 5,62·10⁻⁴ N.","F = |q| E; F = k |Q₁ Q₂| / r²","Verdoppelter Abstand bedeutet ein Viertel der Kraft."],
["Kapazität & Einheiten","Kapazität beschreibt gespeicherten Ladungsbetrag pro Spannung; sie hängt beim idealen Plattenkondensator von Geometrie und Dielektrikum ab.","Kreisplatten: Durchmesser 25,5 cm → Radius 0,1275 m → A=πr²=0,05107 m²; d=0,0015 m; C=3,01·10⁻¹⁰ F ≈301 pF.","C = Q / U = ε₀ εᵣ A / d","1 µF=1000 nF; 1 nF=1000 pF; 1 pF=10⁻¹² F."],
["Schaltungen","Bei parallel geschalteten Kondensatoren ist U gleich, bei Reihenschaltung der Ladungsbetrag (im idealen Fall) gleich.","Reihe 2 nF und 150 pF → 139,5 pF. Parallel 20 pF und 4 pF →24 pF. Reihe(1 nF,2 nF) parallel 4 nF →4,667 nF. Parallel(10 pF,15 pF) in Reihe mit 50 pF →16,667 pF.","Cparallel = C₁ + C₂; 1 / Creihe = 1 / C₁ + 1 / C₂","Zuerst eindeutig verbundene Teilgruppen zusammenfassen."],
["RC-Diagramme","Beim Laden nähert sich U der Quellspannung, beim Entladen nähert sich U der Null. Der Verlauf ist exponentiell.","Nach einer Zeitkonstante τ=RC: Laden 63,2 % der Endspannung, Entladen 36,8 % der Anfangsspannung. Nach 5τ: 99,3 % bzw. 0,67 %.","Uent(t) = U₀ e^(−t/RC); Ulad(t) = U₀ (1−e^(−t/RC))","Aufladen ist in der App als Zusatzwissen markiert; Entladung bleibt Klausurstoff."],
["Elektronenbewegung","Auf Elektronen wirkt die Kraft entgegen der Feldrichtung. Bei einem senkrechten homogenen Feld entsteht eine Parabelbahn.","E=1000 V/m, Strecke 0,10 m, Start aus Ruhe: a=1,759·10¹⁴ m/s², v=5,93·10⁶ m/s, t=3,37·10⁻⁸ s. Senkrechtes Feld: x maximal 0,20 m bei 0,10 m vertikalem Weg.","a = eE / mₑ; v = √(2as); y = aᵧ x² / (2vₓ²)","Horizontal bleibt vₓ konstant; vertikal steigt der Betrag der Geschwindigkeit."],
["Gewitterwolke","Wolke und Boden lassen sich näherungsweise als Plattenkondensator modellieren.","A=8·10⁶ m², d=400 m, E=1,2·10⁵ V/m: C=1,77·10⁻⁷ F, U=4,8·10⁷ V, Q=8,5 C, W=2,04·10⁸ J. Tropfen Ø2 mm: q≈−3,42·10⁻¹⁰ C.","U=Ed; Q=CU; W=½QU; |q|=mg/E","Bei konstanter Ladung und Fläche bleibt E=Q/(ε₀A) unabhängig vom Abstand."],
["Plattenanziehung","Eine geladene Platte zieht die andere an; die Waage zeigt deshalb für die untere Platte eine geringere scheinbare Masse.","Quadrat a=0,280 m, d=0,006 m: C≈1,16·10⁻¹⁰ F. Messwerte ergeben K≈9,70·10⁻⁹ N/V², Theorie K≈9,64·10⁻⁹ N/V².","F = ½ ε₀ A U² / d² = K U²; K = ½ ε₀ a² / d²","Bei doppelter Spannung wird die Anziehungskraft viermal so groß."]
];
const extra=[
["Feldstärke bei Probekörpern","Q₁=4·10⁻⁹ C, F₁=10⁻³ N → E=F/|Q|=2,5·10⁵ N/C. Im homogenen Feld gilt E₁=E₂=E₄. Für Q₂=2·10⁻⁹ C ist F₂=5·10⁻⁴ N."],
["Einheiten vollständig","5 nF=5·10⁻⁹ F=5000 pF; 0,1 pF=0,0001 nF=10⁻⁷ µF; 3·10⁻⁶ F=3 µF=3·10⁶ pF; 0,020 F=20 000 µF=20 000 000 nF; 5,5 µF=0,0055 mF=5,5·10⁻⁶ F; 1,78 F=1780 mF=1,78·10⁹ nF."],
["Feldlinienregeln","Von + nach −; Pfeil = Kraft auf positive Probeladung; hohe Liniendichte = großes E; keine Schnittpunkte; im elektrostatischen Gleichgewicht senkrecht zu leitenden Oberflächen; im Leiterinneren E=0."],
["Wolke und schwebender Tropfen","r=0,001 m; V=4πr³/3=4,189·10⁻⁹ m³; m=ρV=4,189·10⁻⁶ kg; Fg=mg=4,109·10⁻⁵ N; |q|=Fg/E=3,42·10⁻¹⁰ C. Da E nach unten zeigt, muss q negativ sein."],
["Kraftkonstante herleiten","F=½EQ; E=U/d; Q=CU; C=ε₀a²/d. Daher F=½(U/d)(ε₀a²U/d)=½ε₀a²U²/d². Vergleich mit F=KU² ergibt K=½ε₀a²/d²."],
["Messwerte für K","U: 1100,1900,3000,4000 V; F: 0,012;0,035;0,086;0,154 N. K=F/U²: 9,917;9,695;9,556;9,625 (jeweils ·10⁻⁹ N/V²). Mittel 9,698·10⁻⁹ N/V², Theorie 9,642·10⁻⁹ N/V², relative Abweichung rund 0,6 %."],
["Fehlende Messreihe","Die im dritten Blatt erwähnte Messreihe zur direkten Bestimmung von ε₀ ist nicht abgebildet. Die letzte Kraftmessreihe ermöglicht eine alternative Bestimmung: ε₀=2Kd²/a²≈8,91·10⁻¹² F/m."]
];
const cards=[
["Wohin zeigen Feldlinien?","Von positiven zu negativen Ladungen; bei isolierter negativer Ladung radial nach innen."],
["Was bedeutet Feldliniendichte?","Dichter = stärkeres Feld. Feldlinien schneiden sich nicht."],
["Wie wirkt die Kraft auf ein Elektron?","Entgegen der Feldrichtung, weil qₑ negativ ist."],
["Wie berechnet man E aus F und q?","E=F/|q|; Einheit N/C = V/m."],
["Warum ist E bei neutralem Körper nicht null?","E ist eine Eigenschaft des Feldes, nicht der Probeladung. Nur die einfache Kraft qE ist bei q=0 null."],
["Coulomb: Was passiert bei doppeltem Abstand?","Die Kraft sinkt auf ein Viertel, da F proportional zu 1/r² ist."],
["Was bedeutet C=Q/U?","Kapazität ist der Ladungsbetrag pro Spannung; Einheit Farad."],
["Was steigert die Kapazität?","Größere Fläche, kleinerer Abstand, höheres εᵣ – begrenzt durch Spannungsfestigkeit."],
["Wie addieren sich parallele Kondensatoren?","Cges=C₁+C₂; die Spannung ist gleich."],
["Wie addieren sich Kondensatoren in Reihe?","1/Cges=1/C₁+1/C₂; Cges ist kleiner als jede Einzelkapazität."],
["Was ist τ?","Zeitkonstante τ=RC, Einheit Sekunden."],
["Wie viel U bleibt nach τ beim Entladen?","U(τ)=U₀/e≈36,8 %."],
["Warum wird die Entladung langsamer?","Mit sinkender Kondensatorspannung sinkt die Spannung über dem Widerstand und damit der Entladestrom."],
["Wie berechnet man die Elektronenbeschleunigung?","Betrag a=eE/mₑ; Richtung entgegen E."],
["Warum entsteht im Querfeld eine Parabel?","Horizontal vₓ konstant, vertikal gleichmäßig beschleunigt; y∝x²."],
["Wolke: Was passiert mit E bei konstantem Q und A, wenn d sinkt?","E=Q/(ε₀A) bleibt im idealen Modell konstant; U sinkt."],
["Wie berechnet man Kondensatorenergie?","W=½CU²=½QU."],
["Wie misst die Waage die Plattenanziehung?","Über die Abnahme der angezeigten Masse: F=(m₀−mU)g."],
["Warum ist F proportional zu U²?","F=½ε₀A U²/d², bei konstantem A und d."],
["Wie lautet die Formel für ε₀ aus K?","ε₀=2Kd²/a² bei quadratischen Platten."]
];
const quiz=[
["Zwei gleich große negative Ladungen: Feld im Mittelpunkt?",["E=0","E maximal","Feldlinien kreuzen sich"],0,"Die gleich großen Feldvektoren sind entgegengesetzt."],
["Welche Größe bleibt bei einer Parallelschaltung gleich?",["Ladung","Spannung","Kapazität"],1,"Alle Zweige liegen an denselben zwei Knoten."],
["Nach τ beim Entladen verbleiben …",["63,2 %","36,8 %","0 %"],1,"e⁻¹≈0,368."],
["Bei doppeltem Abstand zweier Punktladungen ist F …",["doppelt","halbiert","geviertelt"],2,"F∝1/r²."],
["Ein Elektron im Feld nach oben wird beschleunigt …",["nach oben","nach unten","nicht"],1,"Die negative Ladung kehrt die Kraftrichtung um."],
["Bei konstantem Q und A sinkt der Plattenabstand. E …",["bleibt gleich","steigt","fällt"],0,"Im idealen Kondensator E=Q/(ε₀A)."],
["Reihe aus 2 nF und 0,15 nF ergibt ungefähr …",["2,15 nF","0,140 nF","1,85 nF"],1,"C=(2·0,15)/(2+0,15) nF."],
["Verdoppelte Spannung bei festem Abstand: Plattenkraft …",["verdoppelt","vervierfacht","bleibt"],1,"F=KU²."]
];
const formulas=[["Feldkraft","F=|q|E"],["Feldstärke","E=F/|q|=U/d"],["Coulomb","F=k|Q₁Q₂|/r²"],["Kapazität","C=Q/U"],["Plattenkondensator","C=ε₀εᵣA/d"],["Ladung","Q=CU"],["Energie","W=½CU²=½QU"],["Parallelschaltung","Cges=ΣCᵢ"],["Reihenschaltung","1/Cges=Σ(1/Cᵢ)"],["Zeitkonstante","τ=RC"],["Entladen","U(t)=U₀e^(−t/RC)"],["Laden (Zusatzwissen)","U(t)=U₀(1−e^(−t/RC))"],["Beschleunigung","a=eE/mₑ"],["Bewegung aus Ruhe","v=√(2as); s=½at²"],["Querfeld","y=aᵧx²/(2vₓ²)"],["Plattenanziehung","F=½ε₀AU²/d²"],["Kraftkonstante","K=F/U²=½ε₀a²/d²"],["Feldkonstante aus Messung","ε₀=2Kd²/a²"]];
let view="tasks",cardIndex=0,quizIndex=0,shown=false;const el=document.getElementById("content");function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mathHTML(raw){const f=(a,b)=>'<span class="frac"><span>'+esc(a)+'</span><span>'+esc(b)+'</span></span>';const overrides={
'F=|q|E':'F = |q| · E',
'E=F/|q|=U/d':'E = '+f('F','|q|')+' = '+f('U','d'),
'F=k|Q₁Q₂|/r²':'F = k · '+f('|Q₁ · Q₂|','r²'),
'C=Q/U':'C = '+f('Q','U'),
'C=ε₀εᵣA/d':'C = '+f('ε₀ · εᵣ · A','d'),
'Q=CU':'Q = C · U',
'W=½CU²=½QU':'W = '+f('C · U²','2')+' = '+f('Q · U','2'),
'Cges=ΣCᵢ':'Cges = Σ Cᵢ',
'1/Cges=Σ(1/Cᵢ)':f('1','Cges')+' = Σ '+f('1','Cᵢ'),
'τ=RC':'τ = R · C',
'U(t)=U₀e^(−t/RC)':'U(t) = U₀ · e<sup>−t/(R · C)</sup>',
'U(t)=U₀(1−e^(−t/RC))':'U(t) = U₀ · (1 − e<sup>−t/(R · C)</sup>)',
'a=eE/mₑ':'a = '+f('e · E','mₑ'),
'v=√(2as); s=½at²':'v = √(2 · a · s); s = '+f('a · t²','2'),
'y=aᵧx²/(2vₓ²)':'y = '+f('aᵧ · x²','2 · vₓ²'),
'F=½ε₀AU²/d²':'F = '+f('ε₀ · A · U²','2 · d²'),
'K=F/U²=½ε₀a²/d²':'K = '+f('F','U²')+' = '+f('ε₀ · a²','2 · d²'),
'ε₀=2Kd²/a²':'ε₀ = '+f('2 · K · d²','a²'),
'E = F / |q|':'E = '+f('F','|q|'),
'F = |q| E; F = k |Q₁ Q₂| / r²':'F = |q| · E; F = k · '+f('|Q₁ · Q₂|','r²'),
'C = Q / U = ε₀ εᵣ A / d':'C = '+f('Q','U')+' = '+f('ε₀ · εᵣ · A','d'),
'Cparallel = C₁ + C₂; 1 / Creihe = 1 / C₁ + 1 / C₂':'Cparallel = C₁ + C₂; '+f('1','Creihe')+' = '+f('1','C₁')+' + '+f('1','C₂')
};return '<span class="math">'+(overrides[raw]||esc(raw))+'</span>';}
function render(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
if(view==="tasks"){el.innerHTML='<p class="muted">Alle zentralen Lösungen der Arbeitsblätter. Tippe auf eine Aufgabe, um den Lösungsweg zu öffnen.</p>'+topics.map((t,i)=>'<div class="panel"><h2>'+(i+1)+'. '+esc(t[0])+'</h2><p>'+esc(t[1])+'</p><details><summary>Rechenweg und Ergebnisse anzeigen</summary><p>'+esc(t[2])+'</p><div class="formula">'+esc(t[3])+'</div><p class="tag">'+esc(t[4])+'</p></details></div>').join("")+'<div class="panel"><h2>Weitere Aufgaben & Zwischenschritte</h2>'+extra.map(e=>'<details><summary>'+esc(e[0])+'</summary><p>'+esc(e[1])+'</p></details>').join("")+'</div>';}
if(view==="cards"){const c=cards[cardIndex];el.innerHTML='<div class="panel card"><small>Karte '+(cardIndex+1)+' / '+cards.length+'</small><h2>'+esc(c[0])+'</h2>'+(shown?'<p>'+esc(c[1])+'</p>':'<p class="muted">Überlege zuerst selbst.</p>')+'</div><div class="nav"><button id="prev">← Vorherige</button><button class="primary" id="flip">'+(shown?"Antwort verbergen":"Antwort zeigen")+'</button><button id="next">Nächste →</button></div>';document.getElementById("flip").onclick=()=>{shown=!shown;render()};document.getElementById("prev").onclick=()=>{cardIndex=(cardIndex+cards.length-1)%cards.length;shown=false;render()};document.getElementById("next").onclick=()=>{cardIndex=(cardIndex+1)%cards.length;shown=false;render()};}
if(view==="formulas"){el.innerHTML='<div class="panel"><h2>Formelliste</h2><p class="muted">Größen stets in SI-Einheiten einsetzen: m, s, C, V, N, F.</p><table><thead><tr><th>Größe</th><th>Formel</th></tr></thead><tbody>'+formulas.map(f=>'<tr><td>'+esc(f[0])+'</td><td>'+esc(f[1])+'</td></tr>').join("")+'</tbody></table><p>Konstanten: ε₀≈8,854·10⁻¹² F/m; e≈1,602·10⁻¹⁹ C; mₑ≈9,109·10⁻³¹ kg; g≈9,81 m/s²; k≈8,99·10⁹ Nm²/C².</p></div>';}
if(view==="quiz"){const q=quiz[quizIndex];el.innerHTML='<div class="panel"><small>Frage '+(quizIndex+1)+' / '+quiz.length+'</small><h2>'+esc(q[0])+'</h2>'+q[1].map((a,i)=>'<button class="quizOption" data-answer="'+i+'">'+esc(a)+'</button>').join('')+'<p id="feedback" role="status"></p><button id="nextq">Nächste Frage →</button></div>';document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{const correct=Number(b.dataset.answer)===q[2];b.classList.add(correct?"correct":"wrong");document.getElementById("feedback").textContent=(correct?"Richtig. ":"Noch nicht richtig. ")+q[3];document.querySelectorAll("[data-answer]").forEach(x=>x.disabled=true)});document.getElementById("nextq").onclick=()=>{quizIndex=(quizIndex+1)%quiz.length;render()};}
if(view==="visuals"){el.innerHTML='<div class="panel"><h2>Homogenes Feld</h2><svg viewBox="0 0 500 160" role="img" aria-label="Feldlinien von positiver zu negativer Platte"><rect x="45" y="12" width="20" height="136" fill="#e0a66d"/><rect x="435" y="12" width="20" height="136" fill="#8cb5e8"/><text x="50" y="85" fill="#111" text-anchor="middle">+</text><text x="445" y="85" fill="#111" text-anchor="middle">−</text>'+[35,65,95,125].map(y=>'<path d="M75 '+y+' H425" stroke="#7ad6bc" stroke-width="2"/><path d="M417 '+(y-5)+' l9 5 -9 5" fill="none" stroke="#7ad6bc" stroke-width="2"/>').join('')+'</svg><p>Eine positive Probeladung erfährt die Kraft nach rechts, ein Elektron nach links.</p></div><div class="panel"><h2>Elektron im Querfeld</h2><svg viewBox="0 0 500 200" role="img" aria-label="Elektron fliegt nach rechts und wird parabelförmig nach unten abgelenkt"><rect x="65" y="15" width="400" height="9" fill="#8cb5e8"/><rect x="65" y="170" width="400" height="9" fill="#e0a66d"/><text x="260" y="13" fill="#e8edf6">−</text><text x="260" y="195" fill="#e8edf6">+</text>'+[110,180,250,320,390].map(x=>'<path d="M'+x+' 153 V43 m-5 9 l5 -9 5 9" fill="none" stroke="#74c8a3" stroke-width="2"/>').join('')+'<path d="M20 35 Q220 35 450 156" stroke="#f6b96d" stroke-width="4" fill="none"/><circle cx="20" cy="35" r="6" fill="#8cc8ff"/></svg><p>Die elektrische Feldrichtung zeigt nach oben, die Elektronenkraft nach unten. Die Bahn ist parabelförmig.</p></div><div class="panel"><h2>RC-Laden und Entladen</h2><svg viewBox="0 0 500 210" role="img" aria-label="Exponentielle Lade- und Entladekurven"><path d="M45 15 V175 H475" stroke="#a9b9cb" stroke-width="2" fill="none"/><path id="charge" fill="none" stroke="#79d4a4" stroke-width="3"/><path id="discharge" fill="none" stroke="#efaa70" stroke-width="3"/><text x="50" y="12" fill="white">U</text><text x="480" y="180" fill="white">t</text><text x="300" y="35" fill="#79d4a4">Laden</text><text x="300" y="140" fill="#efaa70">Entladen</text></svg><p>Nach τ=RC: Laden 63,2 %, Entladen 36,8 %. Die Kurven nähern sich ihren Grenzwerten asymptotisch.</p></div>';const pts=fn=>Array.from({length:101},(_,i)=>{const t=i/20;return (i?'L':'M')+(45+i*4.2).toFixed(1)+' '+(175-150*fn(t)).toFixed(1)}).join(' ');document.getElementById("charge").setAttribute("d",pts(t=>1-Math.exp(-t)));document.getElementById("discharge").setAttribute("d",pts(t=>Math.exp(-t)));}}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></body></html>
